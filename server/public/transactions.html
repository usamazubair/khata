<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khata — Transactions</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="lock" class="lock">
    <div class="lock-card">
      <p class="eyebrow">Khata</p>
      <h1>Enter password</h1>
      <p class="lock-sub">This dashboard shows real spending data, so it's locked with the shared password.</p>
      <form id="lock-form">
        <input id="lock-input" type="password" placeholder="Password" autocomplete="current-password" autofocus />
        <button type="submit">Unlock</button>
      </form>
      <p id="lock-error" class="lock-error" hidden>That password didn't work. Try again.</p>
    </div>
  </div>

  <main id="app" hidden>
    <nav id="navbar" class="navbar"></nav>
    <div class="page-wrap">

      <header class="top">
        <div>
          <p class="eyebrow">Khata</p>
          <h1>Transactions</h1>
        </div>
      </header>

      <div class="toolbar">
        <input id="search" class="search-input" type="search" placeholder="Search description or category…" />
        <select id="f-type">
          <option value="">All types</option>
          <option value="expense">Expense</option>
          <option value="fixed">Fixed</option>
          <option value="saved">Saved</option>
          <option value="budget">Budget</option>
        </select>
        <input id="f-from" type="date" title="From date" />
        <input id="f-to" type="date" title="To date" />
        <button id="clear-filters" class="clear-filters" type="button">Clear filters</button>
      </div>

      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th>Amount</th><th>Paid</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="count" class="meta" style="margin-top:10px;"></p>

    </div>
  </main>

<script src="common.js"></script>
<script src="transactions.js"></script>
</body>
</html>
