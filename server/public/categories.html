<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khata — Categories</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>


  <main id="app" hidden>
    <nav id="navbar" class="navbar"></nav>
    <div class="page-wrap">

      <header class="top">
        <div>
          <p class="eyebrow">Khata</p>
          <h1>Categories</h1>
        </div>
      </header>

      <div class="crud-layout">
        <div>
          <div class="toolbar">
            <input id="search" class="search-input" type="search" placeholder="Search categories…" />
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Name</th><th>Slug</th><th>Type</th><th>Status</th><th></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>

        <div class="form-card">
          <h2 id="form-title">Add category</h2>
          <p id="form-error" class="form-error" hidden></p>
          <form id="item-form">
            <input type="hidden" id="f-id" />
            <div class="field-row">
              <label for="f-name">Name</label>
              <input id="f-name" required placeholder="Groceries" />
            </div>
            <div class="field-row">
              <label>Type</label>
              <div class="type-picker" id="f-type"></div>
            </div>
            <div class="field-row">
              <label>Color</label>
              <div class="swatch-row" id="f-color"></div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" id="cancel-edit" class="btn btn-ghost" hidden>Cancel edit</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

<script src="common.js"></script>
<script src="categories.js"></script>
</body>
</html>
