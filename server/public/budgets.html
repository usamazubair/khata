<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khata — Budgets</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>


  <main id="app" hidden>
    <nav id="navbar" class="navbar"></nav>
    <div class="page-wrap">

      <header class="top">
        <div>
          <p class="eyebrow">Khata</p>
          <h1>Budgets</h1>
        </div>
      </header>
      <p class="form-hint" id="no-budget-cat-hint" hidden>You don't have any "budget" type categories yet — <a href="categories.html">add one first</a>.</p>

      <div class="crud-layout">
        <div>
          <div class="toolbar">
            <input id="search" class="search-input" type="search" placeholder="Search budgets…" />
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Name</th><th>Category</th><th>Spent / Price</th><th>Remaining</th><th>Active</th><th></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>

        <div class="form-card">
          <h2 id="form-title">Add budget</h2>
          <p id="form-error" class="form-error" hidden></p>
          <form id="item-form">
            <input type="hidden" id="f-id" />
            <div class="field-row">
              <label for="f-name">Name</label>
              <input id="f-name" required placeholder="Groceries Budget" />
            </div>
            <div class="field-row">
              <label for="f-description">Description</label>
              <textarea id="f-description" placeholder="Optional note"></textarea>
            </div>
            <div class="field-row">
              <label for="f-price">Price (limit, per month)</label>
              <input id="f-price" type="number" min="0" step="0.01" required />
            </div>
            <div class="field-row">
              <label for="f-category">Category (budget)</label>
              <select id="f-category" required></select>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" id="cancel-edit" class="btn btn-ghost" hidden>Cancel edit</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

<script src="common.js"></script>
<script src="budgets.js"></script>
</body>
</html>
