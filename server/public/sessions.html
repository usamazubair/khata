<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khata — Sessions</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main id="app" hidden>
    <nav id="navbar" class="navbar"></nav>
    <div class="page-wrap">

      <header class="top">
        <div>
          <p class="eyebrow">Workout</p>
          <h1>Sessions</h1>
        </div>
      </header>

      <div class="crud-layout">
        <div>
          <div class="toolbar">
            <input id="search" class="search-input" type="search" placeholder="Search sessions…" />
            <input id="f-from" type="date" title="From date" />
            <input id="f-to" type="date" title="To date" />
            <button id="clear-filters" class="clear-filters" type="button">Clear</button>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Date</th><th>Session</th><th>Sets</th><th>Reps</th><th>Volume</th><th></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <p id="count" class="meta" style="margin-top:10px;"></p>
        </div>

        <div class="form-card">
          <h2>Start a session</h2>
          <p id="form-error" class="form-error" hidden></p>
          <form id="item-form">
            <div class="field-row">
              <label for="f-name">Name</label>
              <input id="f-name" placeholder="Push Day" />
            </div>
            <div class="field-row">
              <label for="f-date">Date</label>
              <input id="f-date" type="date" />
            </div>
            <div class="field-row">
              <label for="f-notes">Notes</label>
              <textarea id="f-notes" placeholder="How it went"></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Create &amp; log sets</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

<script src="common.js"></script>
<script src="sessions.js"></script>
</body>
</html>
