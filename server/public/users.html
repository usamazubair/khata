<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khata — Users</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main id="app" hidden>
    <nav id="navbar" class="navbar"></nav>
    <div class="page-wrap">

      <header class="top">
        <div>
          <p class="eyebrow">Settings</p>
          <h1>Users</h1>
        </div>
      </header>
      <p class="form-hint">Members only see the modules you tick for them. Admins always see everything.</p>

      <div class="crud-layout">
        <div>
          <div class="toolbar">
            <input id="search" class="search-input" type="search" placeholder="Search users…" />
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Modules</th><th>Status</th><th></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>

        <div class="form-card">
          <h2 id="form-title">Add user</h2>
          <p id="form-error" class="form-error" hidden></p>
          <form id="item-form">
            <input type="hidden" id="f-id" />
            <div class="field-row">
              <label for="f-name">Name</label>
              <input id="f-name" placeholder="Their name" />
            </div>
            <div class="field-row">
              <label for="f-email">Email</label>
              <input id="f-email" type="email" required placeholder="them@example.com" />
            </div>
            <div class="field-row">
              <label for="f-password">Password</label>
              <input id="f-password" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
              <span id="password-hint" class="form-hint" style="margin:0;" hidden>Leave blank to keep their current password.</span>
            </div>
            <div class="field-row">
              <label>Role</label>
              <div class="type-picker" id="f-role"></div>
            </div>
            <div class="field-row">
              <label>Module access</label>
              <div id="f-modules" class="checkbox-list"></div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" id="cancel-edit" class="btn btn-ghost" hidden>Cancel edit</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

<script src="common.js"></script>
<script src="users.js"></script>
</body>
</html>
