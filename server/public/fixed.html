<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khata — Fixed Transactions</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="lock" class="lock">
    <div class="lock-card">
      <p class="eyebrow">Khata</p>
      <h1>Enter password</h1>
      <p class="lock-sub">This dashboard shows real spending data, so it's locked with the shared password.</p>
      <form id="lock-form">
        <input id="lock-input" type="password" placeholder="Password" autocomplete="current-password" autofocus />
        <button type="submit">Unlock</button>
      </form>
      <p id="lock-error" class="lock-error" hidden>That password didn't work. Try again.</p>
    </div>
  </div>

  <main id="app" hidden>
    <nav id="navbar" class="navbar"></nav>
    <div class="page-wrap">

      <header class="top">
        <div>
          <p class="eyebrow">Khata</p>
          <h1>Fixed Transactions</h1>
        </div>
      </header>
      <p class="form-hint" id="no-fixed-cat-hint" hidden>You don't have any "fixed" type categories yet — <a href="categories.html">add one first</a>.</p>

      <div class="crud-layout">
        <div>
          <div class="toolbar">
            <input id="search" class="search-input" type="search" placeholder="Search fixed transactions…" />
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Name</th><th>Category</th><th>Due</th><th>Amount</th><th>Status</th><th>Active</th><th></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>

        <div class="form-card">
          <h2 id="form-title">Add fixed transaction</h2>
          <p id="form-error" class="form-error" hidden></p>
          <form id="item-form">
            <input type="hidden" id="f-id" />
            <div class="field-row">
              <label for="f-name">Name</label>
              <input id="f-name" required placeholder="Rent" />
            </div>
            <div class="field-row">
              <label for="f-description">Description</label>
              <textarea id="f-description" placeholder="Optional note"></textarea>
            </div>
            <div class="field-grid">
              <div class="field-row">
                <label for="f-amount">Amount</label>
                <input id="f-amount" type="number" min="0" step="0.01" required />
              </div>
              <div class="field-row">
                <label for="f-due">Due day</label>
                <input id="f-due" type="number" min="1" max="31" required />
              </div>
            </div>
            <div class="field-row">
              <label for="f-category">Category (fixed)</label>
              <select id="f-category" required></select>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" id="cancel-edit" class="btn btn-ghost" hidden>Cancel edit</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

<script src="common.js"></script>
<script src="fixed.js"></script>
</body>
</html>
